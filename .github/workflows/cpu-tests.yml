name: CPU package tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-14
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: CPU PyTorch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[plot,test]'
      - run: flowrf install-grtm
      - run: flowrf doctor
      - run: python -m pytest -q
      - run: python reproducibility/scripts/verify_release.py
